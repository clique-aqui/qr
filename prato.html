<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Veja o prato na sua mesa · Horus Technology</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #eef3fb; color: #16204f; }
  header { padding: 14px 18px; background: linear-gradient(120deg, #3b78bd 0%, #33509e 50%, #2a3584 100%); color: #fff; }
  h1 { margin: 0; font-size: 1.25rem; }
  header p { margin: 2px 0 0; font-size: .95rem; color: #dfe8ff; }
  .palco { position: relative; flex: 1; min-height: 0; }
  model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 38%, #ffffff 0%, #dbe5f6 100%); --progress-bar-color: #3c60a8; }
  .ar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 16px 28px; font: inherit; font-size: 1.15rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #3c60a8, #2f3d8f); border: 0; border-radius: 999px; box-shadow: 0 6px 20px rgba(30, 40, 110, .45); white-space: nowrap; }
  .dica { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: .9rem; color: #4a5a85; pointer-events: none; }
  #aviso { display: none; position: absolute; left: 16px; right: 16px; bottom: 18px; padding: 12px 16px; background: #fff; border: 1px solid #c9d5ec; border-radius: 12px; text-align: center; font-size: .95rem; }
  footer { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid #d3dcee; font-size: .9rem; text-align: center; color: #4a5a85; }
  footer b { color: #2f3d8f; }
</style>
</head>
<body>
<header>
  <h1>Pizza de calabresa</h1>
  <p>Veja o prato em tamanho real, em cima da sua mesa</p>
</header>

<div class="palco">
  <model-viewer id="mv" src="pizza.glb" alt="Pizza de calabresa servida em um prato branco"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" xr-environment
    camera-controls touch-action="pan-y" auto-rotate rotation-per-second="18deg"
    camera-orbit="25deg 58deg auto" shadow-intensity="1.2" shadow-softness=".9"
    exposure="0.95" environment-image="neutral">
    <button slot="ar-button" class="ar">Ver na minha mesa</button>
  </model-viewer>
  <div class="dica">Arraste para girar · pince para aproximar</div>
  <div id="aviso">Para ver na mesa, abra este link no <b>celular</b>.</div>
</div>

<footer><b>1.</b> Toque no botão azul &nbsp; <b>2.</b> Aponte a câmera para a mesa &nbsp; <b>3.</b> Toque para colocar o prato</footer>

<script>
  var mv = document.getElementById("mv");
  mv.addEventListener("load", function () {
    if (!mv.canActivateAR) document.getElementById("aviso").style.display = "block";
  });
</script>
</body>
</html>
